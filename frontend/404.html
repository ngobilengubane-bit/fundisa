<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found • Fundisa</title>
  <meta name="description" content="The Fundisa page you're looking for could not be found.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#264C47">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#264C47;
      --ink-soft:#51706C;
      --paper:#FBFAF7;
      --paper-dim:#F1F0EA;
      --card:#FFFFFF;
      --gold:#AE9572;
      --gold-dark:#655642;
      --gold-cta:#827056;
      --green:#1F7A5C;
      --green-dark:#0F4A37;
      --coral:#C7501F;
      --coral-dark:#7A3010;
      --text:#1B1F2A;
      --text-muted:#5B6472;
      --border:#DEDBD1;
      --radius:6px;
      --shadow:0 1px 2px rgba(20,33,61,0.06), 0 4px 14px rgba(20,33,61,0.06);
    }

    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      margin:0;
      min-height:100vh;
      background:var(--paper);
      color:var(--text);
      font-family:'Work Sans',sans-serif;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
    }

    a{color:inherit;}

    .wrap{
      width:min(1080px, calc(100% - 48px));
      margin:0 auto;
    }

    nav{
      border-bottom:1px solid var(--border);
      background:rgba(251,250,247,0.94);
    }

    .navrow{
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      font-family:'Fraunces',serif;
      font-size:22px;
      font-weight:600;
      color:var(--ink);
      letter-spacing:-0.01em;
    }

    .brand-mark{
      width:32px;
      height:32px;
      border:1px solid var(--gold);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:var(--ink);
      font-family:'Fraunces',serif;
      font-size:18px;
    }

    .nav-home{
      color:var(--ink-soft);
      font-size:13px;
      text-decoration:none;
      padding:8px 12px;
      border:1px solid var(--border);
      border-radius:999px;
      transition:background .15s ease,border-color .15s ease,transform .12s ease;
    }

    .nav-home:hover{
      background:var(--card);
      border-color:var(--gold);
      transform:translateY(-1px);
    }

    main{
      flex:1;
      display:grid;
      place-items:center;
      padding:72px 0 92px;
    }

    .error-card{
      width:min(720px,100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:clamp(36px,7vw,72px);
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .error-card::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:4px;
      background:var(--gold);
    }

    .eyebrow{
      margin:0 0 12px;
      color:var(--gold-dark);
      font-family:'IBM Plex Mono',monospace;
      font-size:11px;
      font-weight:500;
      letter-spacing:.07em;
      text-transform:uppercase;
    }

    .error-code{
      margin:0;
      color:var(--ink);
      font-family:'Fraunces',serif;
      font-size:clamp(84px,16vw,150px);
      line-height:.9;
      font-weight:600;
      letter-spacing:-.045em;
    }

    h1{
      margin:22px 0 12px;
      color:var(--ink);
      font-family:'Fraunces',serif;
      font-size:clamp(28px,4vw,42px);
      line-height:1.08;
      font-weight:600;
      letter-spacing:-.02em;
    }

    .message{
      max-width:530px;
      margin:0 auto;
      color:var(--text-muted);
      font-size:15px;
    }

    .path{
      display:inline-block;
      max-width:100%;
      margin-top:18px;
      padding:7px 10px;
      border-radius:4px;
      background:var(--paper-dim);
      color:var(--ink-soft);
      font-family:'IBM Plex Mono',monospace;
      font-size:11px;
      overflow-wrap:anywhere;
    }

    .actions{
      margin-top:30px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:11px 19px;
      border-radius:999px;
      border:1px solid var(--ink);
      background:var(--ink);
      color:#F4EFE2;
      font-size:13.5px;
      font-weight:500;
      text-decoration:none;
      cursor:pointer;
      transition:transform .12s ease,background .15s ease,box-shadow .15s ease;
    }

    .button:hover{
      background:var(--green-dark);
      box-shadow:0 4px 12px rgba(38,76,71,.12);
      transform:translateY(-1px);
    }

    .button:active{transform:scale(.97);}

    .button.secondary{
      background:transparent;
      color:var(--ink);
      border-color:var(--border);
    }

    .button.secondary:hover{
      background:var(--paper-dim);
      border-color:var(--gold);
      box-shadow:none;
    }

    footer{
      border-top:1px solid var(--border);
      padding:20px 0;
      background:var(--paper);
    }

    footer p{
      margin:0;
      text-align:center;
      color:var(--text-muted);
      font-family:'IBM Plex Mono',monospace;
      font-size:11.5px;
    }

    @media (max-width:640px){
      .wrap{width:min(100% - 28px,1080px);}
      .navrow{min-height:64px;}
      .nav-home{font-size:12px; padding:7px 10px;}
      main{padding:48px 0 60px;}
      .error-card{padding:34px 22px 38px;}
      .actions{flex-direction:column;}
      .button{width:100%;}
    }

    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
    }
  </style>
</head>
<body>
  <nav aria-label="Primary navigation">
    <div class="navrow wrap">
      <a class="brand" href="./index.html" aria-label="Fundisa home">
        <span class="brand-mark">F</span>
        <span>Fundisa</span>
      </a>
      <a class="nav-home" href="./index.html">Back to Fundisa</a>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <section class="error-card" aria-labelledby="error-title">
        <p class="eyebrow">Page not found</p>
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="error-title">This page took a wrong turn.</h1>
        <p class="message">
          The page you’re looking for doesn’t exist, may have moved, or the link may be outdated.
          Let’s get you back to the bursaries.
        </p>
        <div class="path" id="requestedPath" aria-label="Requested page"></div>
        <div class="actions">
          <a class="button" href="./index.html">Browse bursaries</a>
          <button class="button secondary" type="button" id="backButton">Go back</button>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p>Fundisa · Your future, funded.</p>
    </div>
  </footer>

  <script>
    const pathEl = document.getElementById('requestedPath');
    if (pathEl) {
      const path = `${window.location.pathname}${window.location.search}`;
      pathEl.textContent = path || '/';
    }

    document.getElementById('backButton')?.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = './index.html';
      }
    });
  </script>
</body>
</html>
